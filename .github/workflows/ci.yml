# CI workflow — runs on every push and pull request.
#
# Checks: cargo check, clippy, test, and frontend build across macOS and Windows.

name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BUILTIN_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  BUILTIN_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # Apple Silicon
            target: aarch64-apple-darwin
          - os: windows-latest   # x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/hivemind-desktop/package-lock.json
            tools/mock-mcp-server/package-lock.json
            packages/plugin-sdk/package-lock.json
            packages/test-plugin/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/hivemind-desktop

      - name: Build mock MCP server
        shell: bash
        run: |
          npm ci
          npm run compile
          test -f dist/index.js || { echo "ERROR: dist/index.js not found after compile"; exit 1; }
          echo "Mock MCP server built: $(pwd)/dist/index.js"
        working-directory: tools/mock-mcp-server

      - name: Build plugin SDK
        run: npm ci && npm run build
        working-directory: packages/plugin-sdk

      - name: Build test plugin
        run: npm ci && npm run build
        working-directory: packages/test-plugin

      - name: Stage Python WASM runtime
        shell: bash
        run: |
          WASM_URL="https://github.com/vmware-labs/webassembly-language-runtimes/releases/download/python%2F3.12.0%2B20231211-040d5a6/python-3.12.0-wasi-sdk-20.0.tar.gz"
          # On Windows, $RUNNER_TEMP is a Windows path (e.g. D:\a\_temp).
          # Convert it to a POSIX path so that bash tools (mkdir, tar, cp) work
          # correctly, then convert back to a Windows path when writing to
          # GITHUB_ENV so that Rust's PathBuf can open the files.
          if command -v cygpath > /dev/null 2>&1; then
            TMP="$(cygpath -u "$RUNNER_TEMP")"
          else
            TMP="$RUNNER_TEMP"
          fi
          STAGING="$TMP/python-wasm"
          EXTRACT="$TMP/python-wasm-extract"
          mkdir -p "$STAGING/bin" "$STAGING/lib" "$EXTRACT"
          TARBALL="$TMP/python-wasm.tar.gz"
          curl -fsSL "$WASM_URL" -o "$TARBALL"
          tar xzf "$TARBALL" -C "$EXTRACT"
          cp "$EXTRACT/bin/"python*.wasm "$STAGING/bin/python.wasm"
          cp -r "$EXTRACT/usr/local/lib/python3.12" "$STAGING/lib/python3.12"
          # python312.zip is required by CPython WASI for the encodings module
          cp "$EXTRACT/usr/local/lib/python312.zip" "$STAGING/lib/python312.zip" 2>/dev/null || true
          if command -v cygpath > /dev/null 2>&1; then
            echo "PYTHON_WASM_PATH=$(cygpath -w "$STAGING/bin/python.wasm")" >> "$GITHUB_ENV"
            echo "PYTHON_WASM_STDLIB=$(cygpath -w "$STAGING/lib/python3.12")" >> "$GITHUB_ENV"
          else
            echo "PYTHON_WASM_PATH=$STAGING/bin/python.wasm" >> "$GITHUB_ENV"
            echo "PYTHON_WASM_STDLIB=$STAGING/lib/python3.12" >> "$GITHUB_ENV"
          fi

      - name: Check version consistency
        run: cargo xtask check-version

      - name: Cargo check
        run: cargo check --workspace --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings

      - name: Tests
        run: cargo test --workspace --target ${{ matrix.target }}
        timeout-minutes: 60
        env:
          HIVEMIND_TEST_PLUGIN_PATH: packages/test-plugin

      - name: Build frontend
        run: npm run build
        working-directory: apps/hivemind-desktop
