# Copilot Coding Agent — Environment Setup
#
# This workflow configures the runner environment for the GitHub Copilot
# coding agent so it can build, test, and iterate on this repository.
#
# Docs: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent

name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── Node.js (needed for desktop frontend and plugin SDK) ───
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/hivemind-desktop/package-lock.json
            packages/plugin-sdk/package-lock.json
            packages/test-plugin/package-lock.json
            tools/mock-mcp-server/package-lock.json

      # ── Install frontend dependencies ──────────────────────────
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/hivemind-desktop

      # ── Build plugin SDK (required by test-plugin and tests) ───
      - name: Build plugin SDK
        run: npm ci && npm run build
        working-directory: packages/plugin-sdk

      # ── Build test plugin (required by plugin integration tests)
      - name: Build test plugin
        run: npm ci && npm run build
        working-directory: packages/test-plugin

      # ── Build mock MCP server (required by MCP integration tests)
      - name: Build mock MCP server
        run: npm ci && npm run compile
        working-directory: tools/mock-mcp-server

      # ── Stage Python WASM runtime (required by code executor tests)
      - name: Stage Python WASM runtime
        run: |
          WASM_URL="https://github.com/vmware-labs/webassembly-language-runtimes/releases/download/python%2F3.12.0%2B20231211-040d5a6/python-3.12.0-wasi-sdk-20.0.tar.gz"
          STAGING="$RUNNER_TEMP/python-wasm"
          EXTRACT="$RUNNER_TEMP/python-wasm-extract"
          mkdir -p "$STAGING/bin" "$STAGING/lib" "$EXTRACT"
          TARBALL="$RUNNER_TEMP/python-wasm.tar.gz"
          curl -fsSL "$WASM_URL" -o "$TARBALL"
          tar xzf "$TARBALL" -C "$EXTRACT"
          cp "$EXTRACT/bin/"python*.wasm "$STAGING/bin/python.wasm"
          cp -r "$EXTRACT/usr/local/lib/python3.12" "$STAGING/lib/python3.12"
          cp "$EXTRACT/usr/local/lib/python312.zip" "$STAGING/lib/python312.zip" 2>/dev/null || true
          echo "PYTHON_WASM_PATH=$STAGING/bin/python.wasm" >> "$GITHUB_ENV"
          echo "PYTHON_WASM_STDLIB=$STAGING/lib/python3.12" >> "$GITHUB_ENV"

      # ── Warm the Rust build cache ──────────────────────────────
      - name: Cargo check (warm build cache)
        run: cargo check --workspace
        env:
          HIVEMIND_TEST_PLUGIN_PATH: packages/test-plugin
